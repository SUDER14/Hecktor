# CPU-only PIPELINE SMOKE TEST. Never a real result.
#
# The local dev machine is CPU-only (no CUDA) with 8GB RAM; real training runs
# on Colab (CLAUDE.md). This config exists only so --overfit-one-batch can check
# shapes, loss reduction and gradient flow locally. Any number it produces says
# nothing about model quality and must never be reported.
#
# Differences from configs/train_baseline_decathlon_lung.yaml, and why:
#   baseline.resample_spacing 2mm (not 1mm)  -- 1mm resampling OOMs on 8GB RAM,
#                                               see train_baseline_decathlon_lung_smoketest.yaml
#   patch.spatial_size 32^3 (not 96^3)       -- CPU forward/backward cost. NOTE: 24^3 is NOT a
#                                               valid fallback with this model: 4 stride-2 levels
#                                               need every side divisible by 16 (verified: MONAI
#                                               UNet raises a size-mismatch RuntimeError at 24^3).
#   micro_batch_size 1, accum_steps 1        -- batch 1, no gradient accumulation
#   amp false                                -- AMP is a CUDA optimisation; CPU gains nothing
#   device cpu                               -- also settable with --device cpu
#   smoke_only true                          -- makes train.py print its "not a real result" banner
# Split, conditioning stats, model and loss are unchanged, so a PASS exercises
# the same code paths as a production run, just on a smaller grid.

seed: 42
smoke_only: true

dataset: decathlon
data_dir: data/Task06_Lung

split:
  strategy: random
  val_frac: 0.15
  test_frac: 0.15
  path: configs/splits/decathlon_lung_seed42.json

conditioning:
  stats_path: configs/splits/decathlon_lung_seed42_conditioning_stats.json

patch:
  spatial_size: [64, 64, 64]
  pos: 2
  neg: 1
  num_samples: 4               # crops per volume load; the overfit test keeps 1 foreground crop, and 4 draws make finding one likely on the first (slow, full-volume) load

intensity:
  ct_window:
    min: -1000
    max: 400
  pet:
    suv_clip_max: 20.0          # inert -- single-modality CT only

baseline:
  resample_spacing: [2.0, 2.0, 2.0]

model:
  name: baseline_unet
  in_channels: 1                # single modality (CT)
  out_channels: 2
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  include_background: true
  lambda_dice: 1.0
  lambda_ce: 1.0
  smooth: 1.0

train:
  device: cpu
  amp: false
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.01
  n_epochs: 2
  val_every: 1
  loader_batch_size: 1
  micro_batch_size: 1
  accum_steps: 1
  sw_batch_size: 1
  num_workers: 0

scheduler:
  name: none

checkpoint:
  dir: results/checkpoints/_cpu_smoke_only_64   # never a real run
  keep_last_n: 1

wandb:
  enabled: false
  project: acf-baseline
  run_name: cpu_smoke_64
  mode: disabled
