# Training config for Baseline 1 (plain single-modality 3D U-Net) on Task06_Lung.
#
# Reuses the already-validated split and conditioning stats from
# configs/data_decathlon_lung.yaml (same seed, same split/stats file paths) so
# train/val/test membership is identical across data-loading and training.
#
# Unlike ACF's own config, this one carries a "baseline" block: Baseline 1 is a
# plain, non-spacing-conditioned U-Net, so its data pipeline resamples to a
# fixed isotropic spacing before cropping (build_baseline_train_transforms /
# build_baseline_val_transforms in src/data/transforms.py) -- the standard way
# to make a fixed voxel patch size mean the same physical extent across scans
# with different native spacing. ACF's own pipeline never resamples.

seed: 42

dataset: decathlon
data_dir: data/Task06_Lung

split:
  strategy: random
  val_frac: 0.15
  test_frac: 0.15
  path: configs/splits/decathlon_lung_seed42.json

conditioning:
  stats_path: configs/splits/decathlon_lung_seed42_conditioning_stats.json

patch:
  spatial_size: [96, 96, 96]
  pos: 2
  neg: 1
  num_samples: 4               # crops/volume; loader_batch_size * num_samples must divide evenly by train.micro_batch_size

intensity:
  ct_window:
    min: -1000                 # HU, air
    max: 400                   # HU, above soft tissue/early bone
  pet:
    suv_clip_max: 20.0          # inert here -- Task06_Lung is CT-only

baseline:
  resample_spacing: [1.0, 1.0, 1.0]   # mm, isotropic

model:
  name: baseline_unet
  in_channels: 1                # single modality (CT)
  out_channels: 2                # background, cancer -- see dataset.json "labels"
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  include_background: true
  lambda_dice: 1.0
  lambda_ce: 1.0
  smooth: 1.0                   # dice smoothing; MONAI's 1e-5 default gives empty-target crops a ~1.0 dice loss floor

train:
  device: auto                  # cuda if available, else cpu
  amp: true                     # only actually engaged when device resolves to cuda
  optimizer: adamw               # AdamW; lr and weight_decay below are standard defaults (lr 1e-4, torch AdamW decay 0.01), NOT tuned values
  lr: 0.0001
  weight_decay: 0.01
  n_epochs: 100
  val_every: 5
  loader_batch_size: 1           # volumes per DataLoader fetch -> num_samples=4 crops after collate
  micro_batch_size: 2             # patches per forward/backward pass (physical, VRAM-bound)
  accum_steps: 4                  # effective batch = micro_batch_size * accum_steps = 8, per CLAUDE.md
  sw_batch_size: 1                 # sliding-window inference batch size at validation
  num_workers: 0

scheduler:
  name: cosine                  # cosine | none -- "none" holds train.lr constant
  eta_min: 0.0000001             # cosine floor, decayed over train.n_epochs

checkpoint:
  dir: results/checkpoints/baseline_decathlon_lung_seed42   # point this at a mounted Drive path on Colab
  keep_last_n: 3                                             # epoch_*.pt files retained on disk; best.pt is kept separately, never pruned

wandb:
  enabled: false                # flip to true once a wandb account/API key is set up; smoke tests never log regardless of this flag
  project: acf-baseline
  run_name: baseline_decathlon_lung_seed42
  mode: online                   # online | offline | disabled -- offline is useful on a Colab runtime with no outbound network
